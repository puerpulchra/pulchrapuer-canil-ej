name: Monitor do site
on:
  schedule: [{ cron: "0 7 * * 1" }]
  workflow_dispatch:
    inputs:
      url: { description: "URL do site publicado", required: false }
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: node scripts/build.mjs
      - run: python3 scripts/monitor.py "${{ github.event.inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: monitor, path: docs/medicao/monitor-*.md }
