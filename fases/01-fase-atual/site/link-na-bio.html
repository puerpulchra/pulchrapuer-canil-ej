<style>
:root{--bg:#04141b;--fg:#e8f1ee;--mut:#8fa9b3;--line:#1f4757;--surf:#0a2430;--acc:#7ee0cf;--on:#03211c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f0f5f3;--fg:#07202a;--mut:#46606a;--line:#c7d7d3;--surf:#fff;--acc:#0c7a69;--on:#fff}}
:root[data-theme="light"]{--bg:#f0f5f3;--fg:#07202a;--mut:#46606a;--line:#c7d7d3;--surf:#fff;--acc:#0c7a69;--on:#fff}
body{background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:440px;margin:0 auto}
.top{text-align:center}.top svg{width:96px;fill:var(--acc)}
h1{font-size:34px;font-weight:900;letter-spacing:-.045em;margin:10px 0 4px}
.top p{color:var(--mut);font-size:15px;margin:0 0 28px}
a.b{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:4px;background:var(--surf);color:var(--fg);text-decoration:none;font-weight:700;font-size:16px}
a.b small{color:var(--mut);font-weight:400;font-size:13px}
a.b.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
a.b:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
